<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Outfit:wght@700;800;900&amp;display=swap');
      .cyber-title { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 38px; fill: #00F0FF; filter: drop-shadow(0px 0px 8px rgba(0, 240, 255, 0.6)); }
      .cyber-sub { font-family: 'Share Tech Mono', monospace; font-size: 16px; font-weight: 700; fill: #FF0055; letter-spacing: 1.5px; }
      .cyber-info { font-family: 'Share Tech Mono', monospace; font-size: 13.5px; fill: #94A3B8; }
      .cyber-cyan { fill: #00F0FF; font-weight: bold; }
      .cyber-yellow { fill: #FFE600; font-weight: bold; }
      .cyber-pink { fill: #FF0055; font-weight: bold; }
    </style>
    
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0D0F1D"/>
      <stop offset="100%" stop-color="#070A18"/>
    </linearGradient>

    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF0055"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="1180" height="280" rx="10" fill="url(#cyber-bg)" stroke="#00F0FF" stroke-width="2" opacity="0.95"/>
  <rect width="1180" height="280" fill="url(#grid)"/>

  <!-- Cyberpunk Top HUD Bar -->
  <path d="M 0 0 L 1180 0 L 1180 36 L 1150 36 L 1140 46 L 40 46 L 30 36 L 0 36 Z" fill="#0D1326" stroke="#00F0FF" stroke-width="1.5"/>
  <text x="50" y="26" font-family="'Share Tech Mono', monospace" font-size="13" fill="#00F0FF">// CYBER_NET v2.077 :: FELIPE.EXE</text>
  <text x="1130" y="26" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="13" fill="#FF0055">[ SYSTEM_ACTIVE ]</text>
  
  <!-- Cyber HUD Decorative Lines -->
  <line x1="0" y1="270" x2="1180" y2="270" stroke="#FF0055" stroke-width="2"/>
  <rect x="1100" y="265" width="40" height="10" fill="#FFE600"/>

  <!-- Left Column - Cyber Avatar HUD Frame -->
  <g transform="translate(60, 75)">
    <!-- Outer Octagon HUD -->
    <polygon points="20,0 120,0 140,20 140,120 120,140 20,140 0,120 0,20" fill="#0D1326" stroke="#00F0FF" stroke-width="2"/>
    <polygon points="25,5 115,5 135,25 135,115 115,135 25,135 5,115 5,25" fill="#050814" stroke="#FF0055" stroke-width="1" opacity="0.7"/>
    <!-- Cyber Logo Symbol -->
    <text x="70" y="82" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="42" font-weight="900" fill="#00F0FF" filter="drop-shadow(0px 0px 6px #00F0FF)">&lt;/&gt;</text>
    <text x="70" y="112" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="10" fill="#FFE600">CYBER_ID#99</text>
  </g>

  <!-- Right Column - Information Readout -->
  <g transform="translate(235, 92)">
    <!-- Name -->
    <text x="0" y="22" class="cyber-title">FELIPE MZERO</text>
    
    <!-- Role Subtitle -->
    <text x="0" y="50" class="cyber-sub">&gt; SYSADMIN // BACKEND DEVELOPER // AOSP ENTHUSIAST</text>
    
    <!-- Cyberpunk Dotted Tech Readouts -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" class="cyber-info">[<tspan class="cyber-cyan">+</tspan>] CORE_MODULES ... <tspan class="cyber-yellow">Active Directory</tspan> // <tspan class="cyber-yellow">Windows Server</tspan> // Python // Linux // AOSP</text>
      <text x="0" y="24" class="cyber-info">[<tspan class="cyber-cyan">+</tspan>] LOCATION ....... HOSPITAL MENINO JESUS // ORIXIMINA, PA</text>
      <text x="0" y="48" class="cyber-info">[<tspan class="cyber-cyan">+</tspan>] STATUS ......... <tspan class="cyber-pink">[ ONLINE // AUTOMATING INFRASTRUCTURE ]</tspan></text>
    </g>
  </g>
</svg>
