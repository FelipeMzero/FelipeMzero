<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Outfit:wght@700;800;900&amp;display=swap');
      .title-name { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 36px; fill: #22D3EE; letter-spacing: 0.5px; }
      .sub-role { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 600; fill: #A78BFA; }
      .readout-label { font-family: 'Fira Code', monospace; font-size: 13.5px; font-weight: 600; fill: #94A3B8; }
      .readout-val { font-family: 'Fira Code', monospace; font-size: 13.5px; fill: #F8FAFC; }
      .accent-text { fill: #10B981; font-weight: 600; }
      .pill-text { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 700; fill: #0A101F; }
    </style>
    
    <linearGradient id="bg-master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101F"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Background Terminal Box -->
  <rect width="1180" height="300" rx="12" fill="url(#bg-master)" stroke="#1E293B" stroke-width="2"/>

  <!-- Terminal Title Bar -->
  <rect width="1180" height="42" rx="12" fill="#0F172A"/>
  <rect y="30" width="1180" height="12" fill="#0F172A"/>

  <!-- Window Control Buttons -->
  <circle cx="25" cy="21" r="6" fill="#EF4444"/>
  <circle cx="45" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="21" r="6" fill="#10B981"/>

  <!-- Terminal Title -->
  <text x="590" y="25" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#94A3B8">profile.sh --live</text>

  <!-- Pulsing Red LIVE Badge -->
  <g transform="translate(1010, 11)">
    <rect width="60" height="20" rx="10" fill="#EF4444" opacity="0.2"/>
    <circle cx="14" cy="10" r="4" fill="#EF4444"/>
    <text x="37" y="14" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#EF4444">LIVE</text>
  </g>

  <!-- Username Pill Badge -->
  <g transform="translate(1080, 11)">
    <rect width="88" height="20" rx="10" fill="url(#pill-grad)"/>
    <text x="44" y="14" text-anchor="middle" class="pill-text">@FelipeMzero</text>
  </g>

  <!-- LEFT FRAME: VISUAL.MAP -->
  <g transform="translate(45, 65)">
    <!-- Outer Frame -->
    <rect width="180" height="210" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
    <!-- Label -->
    <rect x="15" y="10" width="90" height="18" rx="4" fill="#1E293B"/>
    <text x="60" y="23" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#22D3EE">VISUAL.MAP</text>
    <!-- Portrait/Matrix Dither Canvas -->
    <rect x="15" y="38" width="150" height="155" rx="6" fill="#0A101F" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="90" y="125" text-anchor="middle" font-family="'Fira Code', monospace" font-size="46" fill="#A78BFA">&lt;/&gt;</text>
    <text x="90" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#10B981">[DITHER_ACTIVE]</text>
  </g>

  <!-- RIGHT SECTION: SYSTEM.INFO READOUT WITH DOTTED LEADERS -->
  <g transform="translate(260, 85)">
    <!-- Name and Role -->
    <text x="0" y="15" class="title-name">FELIPE MZERO</text>
    <text x="0" y="40" class="sub-role">&gt; Técnico em Informática | Backend &amp; SysAdmin</text>

    <!-- Dotted Readout Leaders -->
    <g transform="translate(0, 75)">
      <!-- Line 1 -->
      <text x="0" y="0" class="readout-label">SYSTEM.INFO</text>
      <text x="110" y="0" class="readout-label" fill="#334155">....................................................................</text>
      <text x="680" y="0" text-anchor="end" class="readout-val">Active Directory • Windows Server • Python • Linux • AOSP</text>

      <!-- Line 2 -->
      <text x="0" y="30" class="readout-label">LOCATION</text>
      <text x="110" y="30" class="readout-label" fill="#334155">....................................................................</text>
      <text x="680" y="30" text-anchor="end" class="readout-val">Hospital Menino Jesus — Oriximiná, PA</text>

      <!-- Line 3 -->
      <text x="0" y="60" class="readout-label">STATUS</text>
      <text x="110" y="60" class="readout-label" fill="#334155">....................................................................</text>
      <text x="680" y="60" text-anchor="end" class="readout-val accent-text">[ Building + Learning + Automating ]</text>
    </g>
  </g>
</svg>
