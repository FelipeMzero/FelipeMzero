<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 34px; fill: url(#accent-grad); }
      .sub-text { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 17px; fill: #F8FAFC; }
      .info-text { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 14px; fill: #94A3B8; }
      .bar-text { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; fill: #94A3B8; }
    </style>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101F"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="1180" height="280" rx="12" fill="url(#bg-dark)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Terminal Window Bar -->
  <rect width="1180" height="40" rx="12" fill="#0F172A"/>
  <rect y="28" width="1180" height="12" fill="#0F172A"/>
  
  <!-- Window Controls -->
  <circle cx="25" cy="20" r="6" fill="#EF4444"/>
  <circle cx="45" cy="20" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="20" r="6" fill="#10B981"/>
  
  <!-- Title -->
  <text x="590" y="24" text-anchor="middle" class="bar-text">felipe@dev:~ (profile.sh --live)</text>
  
  <!-- LIVE badge -->
  <rect x="1080" y="10" width="70" height="20" rx="10" fill="#EF4444" opacity="0.2"/>
  <circle cx="1095" cy="20" r="4" fill="#EF4444"/>
  <text x="1122" y="24" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#EF4444">LIVE</text>
  
  <!-- Main Content Area -->
  <g transform="translate(60, 70)">
    <rect width="140" height="140" rx="16" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="2"/>
    <text x="70" y="85" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="44" font-weight="800" fill="#22D3EE">&lt;/&gt;</text>
  </g>
  
  <g transform="translate(240, 90)">
    <text x="0" y="20" class="title-text">FELIPE MZERO</text>
    <text x="0" y="48" class="sub-text">Técnico em Informática | Backend &amp; SysAdmin</text>
    
    <text x="0" y="85" class="info-text">SYSTEM.INFO ...... Active Directory • Windows Server • Python • Linux • AOSP</text>
    <text x="0" y="110" class="info-text">LOCATION ......... Hospital Menino Jesus — Oriximiná, PA</text>
    <text x="0" y="135" class="info-text" fill="#10B981">STATUS ........... [Building + Learning + Automating]</text>
  </g>
</svg>
