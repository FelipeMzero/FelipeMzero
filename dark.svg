<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Outfit:wght@600;700;800&amp;display=swap');
      .mc-title { font-family: 'Press Start 2P', monospace; font-size: 24px; fill: #FFFF55; text-shadow: 3px 3px 0px #3F3F15; }
      .mc-sub { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 18px; fill: #55FFFF; }
      .mc-text { font-family: 'Outfit', sans-serif; font-size: 14px; fill: #AAAAAA; }
      .mc-gold { fill: #FFAA00; font-weight: 700; }
      .mc-green { fill: #55FF55; font-weight: 700; }
    </style>
    <linearGradient id="xp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55FF55"/>
      <stop offset="100%" stop-color="#00AA00"/>
    </linearGradient>
  </defs>

  <!-- Minecraft Dark GUI Container -->
  <rect width="1180" height="280" rx="6" fill="#121212" stroke="#373737" stroke-width="4"/>
  <rect x="8" y="8" width="1164" height="264" rx="4" fill="#1E1E1E" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Top GUI Header Bar -->
  <rect x="14" y="14" width="1152" height="36" fill="#2C2C2C"/>
  <text x="30" y="38" font-family="'Press Start 2P', monospace" font-size="12" fill="#FFAA00">Minecraft v1.20.4 - Felipe's World</text>
  <text x="1130" y="38" text-anchor="end" font-family="'Press Start 2P', monospace" font-size="12" fill="#55FF55">ONLINE</text>

  <!-- Player Avatar Box (Pixelated Crafting Slot) -->
  <g transform="translate(40, 70)">
    <rect width="140" height="140" fill="#8B8B8B" stroke="#373737" stroke-width="4"/>
    <rect x="6" y="6" width="128" height="128" fill="#3C3C3C"/>
    <!-- Minecraft Diamond Pickaxe Icon Placeholder -->
    <text x="70" y="85" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="44" fill="#55FFFF">⛏️</text>
  </g>

  <!-- Main Info Section -->
  <g transform="translate(210, 85)">
    <!-- Player Name -->
    <text x="0" y="20" class="mc-title">FELIPE MZERO</text>
    
    <!-- Player Title -->
    <text x="0" y="50" class="mc-sub">[ Level 99 ] Técnico em Informática | Backend &amp; SysAdmin</text>
    
    <!-- XP Bar -->
    <g transform="translate(0, 65)">
      <rect width="650" height="14" rx="7" fill="#000000" stroke="#373737" stroke-width="2"/>
      <rect x="2" y="2" width="610" height="10" rx="5" fill="url(#xp-grad)"/>
      <text x="325" y="10" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="9" fill="#FFFFFF">XP: 99999 / 99999</text>
    </g>

    <!-- Character Stats Readout -->
    <text x="0" y="110" class="mc-text">CLASS ...... <tspan class="mc-gold">SysAdmin &amp; Automation Developer</tspan></text>
    <text x="0" y="132" class="mc-text">EQUIPMENT .. Active Directory • Windows Server • Python • Linux • AOSP</text>
    <text x="0" y="154" class="mc-text">BIOME ...... <tspan class="mc-green">Hospital Menino Jesus — Oriximiná, PA</tspan></text>
  </g>
</svg>
