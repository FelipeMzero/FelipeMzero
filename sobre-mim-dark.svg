<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 270" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Outfit:wght@600;700;800&amp;display=swap');
      .mc-ach-title { font-family: 'Press Start 2P', monospace; font-size: 15px; fill: #FFFF55; text-shadow: 2px 2px 0px #3F3F15; }
      .mc-ach-header { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 400; fill: #AAAAAA; }
      .mc-quest { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 400; fill: #F8FAFC; }
    </style>
  </defs>
  
  <!-- Minecraft Inventory Card Frame -->
  <rect width="1180" height="270" rx="6" fill="#121212" stroke="#373737" stroke-width="4"/>
  <rect x="8" y="8" width="1164" height="254" rx="4" fill="#1E1E1E" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Achievement Popup Box Header -->
  <g transform="translate(25, 25)">
    <rect width="450" height="42" rx="4" fill="#212121" stroke="#FFAA00" stroke-width="2"/>
    <text x="15" y="27" class="mc-ach-title">🏆 Advancement Made!</text>
  </g>

  <g transform="translate(35, 95)">
    <text x="0" y="0" class="mc-ach-header">Profissional de TI multifuncional, transitando entre a infraestrutura crítica hospitalar e desenvolvimento moderno.</text>
    <text x="0" y="22" class="mc-ach-header">Especialista em unir automação de sistemas, suporte técnico e engenharia de backend.</text>
    
    <text x="0" y="60" class="mc-quest">🗡️ <tspan font-weight="700" fill="#55FFFF">Foco Atual:</tspan> Automação de infraestrutura via Python (Active Directory &amp; Windows Server) e otimização hospitalar.</text>
    <text x="0" y="90" class="mc-quest">📘 <tspan font-weight="700" fill="#A78BFA">Aprendizado Contínuo:</tspan> Explorando as profundezas do AOSP (Android Open Source Project) e customização de ROMs.</text>
    <text x="0" y="120" class="mc-quest">⚡ <tspan font-weight="700" fill="#55FF55">Lado Criativo:</tspan> Desenvolvedor de Mods e Scripts GSC para Call of Duty: Black Ops 2 (Plutonium).</text>
    <text x="0" y="150" class="mc-quest">🗺️ <tspan font-weight="700" fill="#FFAA00">Interesses:</tspan> Data Visualization, Telecomunicações e Arquitetura de Redes.</text>
  </g>
</svg>
