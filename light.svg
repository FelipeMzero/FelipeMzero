<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;display=swap');
      .title-text-light { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 34px; fill: url(#accent-grad-light); }
      .sub-text-light { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 17px; fill: #0F172A; }
      .info-text-light { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 14px; fill: #475569; }
      .bar-text-light { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
    </style>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="1180" height="280" rx="12" fill="url(#bg-light)" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Terminal Window Bar -->
  <rect width="1180" height="40" rx="12" fill="#F1F5F9"/>
  <rect y="28" width="1180" height="12" fill="#F1F5F9"/>
  
  <!-- Window Controls -->
  <circle cx="25" cy="20" r="6" fill="#EF4444"/>
  <circle cx="45" cy="20" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="20" r="6" fill="#10B981"/>
  
  <!-- Title -->
  <text x="590" y="24" text-anchor="middle" class="bar-text-light">felipe@dev:~ (profile.sh --live)</text>
  
  <!-- LIVE badge -->
  <rect x="1080" y="10" width="70" height="20" rx="10" fill="#EF4444" opacity="0.15"/>
  <circle cx="1095" cy="20" r="4" fill="#EF4444"/>
  <text x="1122" y="24" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#DC2626">LIVE</text>
  
  <!-- Main Content Area -->
  <g transform="translate(60, 70)">
    <rect width="140" height="140" rx="16" fill="#F1F5F9" stroke="url(#accent-grad-light)" stroke-width="2"/>
    <text x="70" y="85" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="44" font-weight="800" fill="#0891B2">&lt;/&gt;</text>
  </g>
  
  <g transform="translate(240, 90)">
    <text x="0" y="20" class="title-text-light">FELIPE MZERO</text>
    <text x="0" y="48" class="sub-text-light">Técnico em Informática | Backend &amp; SysAdmin</text>
    
    <text x="0" y="85" class="info-text-light">SYSTEM.INFO ...... Active Directory • Windows Server • Python • Linux • AOSP</text>
    <text x="0" y="110" class="info-text-light">LOCATION ......... Hospital Menino Jesus — Oriximiná, PA</text>
    <text x="0" y="135" class="info-text-light" fill="#059669">STATUS ........... [Building + Learning + Automating]</text>
  </g>
</svg>
