<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Outfit:wght@700;800;900&amp;display=swap');
      .title-name-light { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 36px; fill: #0891B2; letter-spacing: 0.5px; }
      .sub-role-light { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 600; fill: #7C3AED; }
      .readout-label-light { font-family: 'Fira Code', monospace; font-size: 13.5px; font-weight: 600; fill: #475569; }
      .readout-val-light { font-family: 'Fira Code', monospace; font-size: 13.5px; fill: #0F172A; }
      .accent-text-light { fill: #059669; font-weight: 600; }
      .pill-text-light { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    </style>
    
    <linearGradient id="bg-master-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="pill-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background Terminal Box -->
  <rect width="1180" height="300" rx="12" fill="url(#bg-master-light)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Terminal Title Bar -->
  <rect width="1180" height="42" rx="12" fill="#F1F5F9"/>
  <rect y="30" width="1180" height="12" fill="#F1F5F9"/>

  <!-- Window Control Buttons -->
  <circle cx="25" cy="21" r="6" fill="#EF4444"/>
  <circle cx="45" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="21" r="6" fill="#10B981"/>

  <!-- Terminal Title -->
  <text x="590" y="25" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#475569">profile.sh --live</text>

  <!-- Pulsing Red LIVE Badge -->
  <g transform="translate(1010, 11)">
    <rect width="60" height="20" rx="10" fill="#EF4444" opacity="0.15"/>
    <circle cx="14" cy="10" r="4" fill="#EF4444"/>
    <text x="37" y="14" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#DC2626">LIVE</text>
  </g>

  <!-- Username Pill Badge -->
  <g transform="translate(1080, 11)">
    <rect width="88" height="20" rx="10" fill="url(#pill-grad-light)"/>
    <text x="44" y="14" text-anchor="middle" class="pill-text-light">@FelipeMzero</text>
  </g>

  <!-- LEFT FRAME: VISUAL.MAP -->
  <g transform="translate(45, 65)">
    <!-- Outer Frame -->
    <rect width="180" height="210" rx="10" fill="#F1F5F9" stroke="#0891B2" stroke-width="2"/>
    <!-- Label -->
    <rect x="15" y="10" width="90" height="18" rx="4" fill="#E2E8F0"/>
    <text x="60" y="23" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#0891B2">VISUAL.MAP</text>
    <!-- Portrait/Matrix Dither Canvas -->
    <rect x="15" y="38" width="150" height="155" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="90" y="125" text-anchor="middle" font-family="'Fira Code', monospace" font-size="46" fill="#7C3AED">&lt;/&gt;</text>
    <text x="90" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#059669">[DITHER_ACTIVE]</text>
  </g>

  <!-- RIGHT SECTION: SYSTEM.INFO READOUT WITH DOTTED LEADERS -->
  <g transform="translate(260, 85)">
    <!-- Name and Role -->
    <text x="0" y="15" class="title-name-light">FELIPE MZERO</text>
    <text x="0" y="40" class="sub-role-light">&gt; Técnico em Informática | Backend &amp; SysAdmin</text>

    <!-- Dotted Readout Leaders -->
    <g transform="translate(0, 75)">
      <!-- Line 1 -->
      <text x="0" y="0" class="readout-label-light">SYSTEM.INFO</text>
      <text x="110" y="0" class="readout-label-light" fill="#CBD5E1">....................................................................</text>
      <text x="680" y="0" text-anchor="end" class="readout-val-light">Active Directory • Windows Server • Python • Linux • AOSP</text>

      <!-- Line 2 -->
      <text x="0" y="30" class="readout-label-light">LOCATION</text>
      <text x="110" y="30" class="readout-label-light" fill="#CBD5E1">....................................................................</text>
      <text x="680" y="30" text-anchor="end" class="readout-val-light">Hospital Menino Jesus — Oriximiná, PA</text>

      <!-- Line 3 -->
      <text x="0" y="60" class="readout-label-light">STATUS</text>
      <text x="110" y="60" class="readout-label-light" fill="#CBD5E1">....................................................................</text>
      <text x="680" y="60" text-anchor="end" class="readout-val-light accent-text-light">[ Building + Learning + Automating ]</text>
    </g>
  </g>
</svg>
